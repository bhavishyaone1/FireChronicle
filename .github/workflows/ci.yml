name: FireChronicle CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    name: Backend Pytest & Mathematical Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn duckdb pyarrow pandas numpy scipy httpx pydantic pytest pytest-asyncio

      - name: Execute Pytest Suite
        run: |
          python -m pytest backend/tests/ -v

  frontend-build:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Static Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Next.js Production Build
        run: |
          cd frontend
          npm run build
